<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي المنشور تلقائياً</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 { color: #38bdf8; margin-top: 0; }
    p { color: #cbd5e1; line-height: 1.7; }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #052e16;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 999px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 تم النشر بنجاح!</h1>
    <p>تم إنشاء هذا المستودع ورفع ملف <strong>index.html</strong> وتفعيل <strong>GitHub Pages</strong> تلقائياً بضغطة زر واحدة.</p>
    <div class="badge">GitHub Pages Live ✓</div>
  </div>
</body>
</html>
